[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weave-jacquard"
version = "0.1.0"
description = "Jacquard: the agent-native programming environment for Weave"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Weave contributors" }]
keywords = ["weave", "jacquard", "compiler", "s-expression", "agents", "sqlite", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mcp>=1.28.1,<2",
]

[project.urls]
Repository = "https://github.com/ahojukka5/weave-jacquard"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
weave-mcp = "weave_jacquard.mcp_build:main"
weave-build = "weave_jacquard.build_cli:main"
weave-manifest-diff = "weave_jacquard.manifest_compatibility_cli:main"
weave-release-compatibility = "weave_frontend.release_compatibility:main"
weave-artifact-reconcile = "weave_frontend.artifact_reconciliation_cli:main"
weave-artifact-retention-plan = "weave_frontend.artifact_retention_cli:main"
weave-artifact-quarantine = "weave_frontend.artifact_quarantine_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "real_mcp: launches the actual stdio MCP server and uses the public protocol",
  "real_e2e: requires an executable final weavec and produces a native program",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
