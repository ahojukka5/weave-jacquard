name: Generate evidence profile slice

on:
  push:
    branches:
      - agent/evidence-profile-generator

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evidence-profile-generator
          fetch-depth: 0

      - name: Generate implementation
        run: python scripts/evidence_profile_generator.py

      - name: Validate generated tree
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff format .
          python -m ruff check --fix .
          python -m compileall -q src tests scripts
          python -m pytest -q \
            tests/test_build_targets.py \
            tests/test_compiler_capabilities.py \
            tests/test_compiler_evidence_profiles.py \
            tests/test_compiler_package_architecture.py
          python -m ruff check .
          git diff --check

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit \
            -m "feat(compiler): add evidence profiles" \
            -m "Add strict none, minimal, and full evidence profiles to revisioned build targets, compiler capability preflight, and build-key identity."
          git push origin HEAD:agent/evidence-profile-generator
