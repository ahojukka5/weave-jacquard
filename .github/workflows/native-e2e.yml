name: Packaged weavec native E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  WEAVEC_RELEASE: v0.3.0

jobs:
  native-qualification:
    name: Packaged compiler qualification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      QUALIFICATION_DIR: ${{ runner.temp }}/jacquard-native-qualification
      COMPILER_STAGE: ${{ runner.temp }}/jacquard-weavec-release

    steps:
      - name: Check out Jacquard
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Jacquard qualification environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Install native and sandbox runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap clang file llvm
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [[ -e /proc/sys/kernel/unprivileged_userns_clone ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

      - name: Resolve immutable weavec release assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$COMPILER_STAGE"
          gh api "repos/ahojukka5/weavec/releases/tags/$WEAVEC_RELEASE" \
            > "$COMPILER_STAGE/release-metadata.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          stage = Path(os.environ["COMPILER_STAGE"])
          release = json.loads(
              (stage / "release-metadata.json").read_text(encoding="utf-8")
          )
          assets = release.get("assets", [])
          archives = [
              asset
              for asset in assets
              if asset["name"].endswith("-linux-x86_64-glibc.tar.gz")
          ]
          checksums = [asset for asset in assets if asset["name"] == "SHA256SUMS"]
          assert len(archives) == 1, [asset["name"] for asset in assets]
          assert len(checksums) == 1, [asset["name"] for asset in assets]

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"archive_name={archives[0]['name']}\n")
              stream.write(f"archive_url={archives[0]['browser_download_url']}\n")
              stream.write(f"checksum_url={checksums[0]['browser_download_url']}\n")
          PY

      - name: Download and verify packaged weavec
        env:
          ARCHIVE_NAME: ${{ steps.release.outputs.archive_name }}
          ARCHIVE_URL: ${{ steps.release.outputs.archive_url }}
          CHECKSUM_URL: ${{ steps.release.outputs.checksum_url }}
        run: |
          set -euo pipefail
          mkdir -p "$COMPILER_STAGE/dist" "$COMPILER_STAGE/compiler"
          curl --fail --location --retry 3 \
            "$ARCHIVE_URL" \
            --output "$COMPILER_STAGE/dist/$ARCHIVE_NAME"
          curl --fail --location --retry 3 \
            "$CHECKSUM_URL" \
            --output "$COMPILER_STAGE/dist/SHA256SUMS"

          grep -F " $ARCHIVE_NAME" "$COMPILER_STAGE/dist/SHA256SUMS" \
            > "$COMPILER_STAGE/dist/GLIBC-SHA256SUM"
          (
            cd "$COMPILER_STAGE/dist"
            sha256sum --check GLIBC-SHA256SUM
          )

          tar -C "$COMPILER_STAGE/compiler" \
            -xzf "$COMPILER_STAGE/dist/$ARCHIVE_NAME"
          compiler_path="$(
            find "$COMPILER_STAGE/compiler" \
              -type f -path '*/bin/weavec' -print -quit
          )"
          test -n "$compiler_path"
          test -x "$compiler_path"
          command -v clang
          command -v llvm-as
          file "$compiler_path"
          printf 'WEAVEC_BIN=%s\n' "$compiler_path" >> "$GITHUB_ENV"

      - name: Run unified native qualification
        run: bash scripts/qualify.sh native "$QUALIFICATION_DIR"

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: jacquard-native-qualification
          path: ${{ env.QUALIFICATION_DIR }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload compiler release metadata
        uses: actions/upload-artifact@v4
        with:
          name: jacquard-weavec-release-metadata
          path: ${{ env.COMPILER_STAGE }}/release-metadata.json
          if-no-files-found: error
          retention-days: 7
