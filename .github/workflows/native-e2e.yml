name: Pinned weavec native E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  WEAVEC_REPOSITORY: ahojukka5/weavec
  WEAVEC_COMMIT: f5c1196b3a75c0b2721b3bd753edbcc8d1388244

jobs:
  native-qualification:
    name: "test: native E2E against pinned weavec"
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out Jacquard
        uses: actions/checkout@v4

      - name: Set up job-local scratch directories
        run: |
          echo "QUALIFICATION_DIR=${{ runner.temp }}/jacquard-native-qualification" >> "$GITHUB_ENV"
          echo "COMPILER_STAGE=${{ runner.temp }}/jacquard-weavec-provider" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Jacquard qualification environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Install native, compiler, and sandbox runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap clang file llvm
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [[ -e /proc/sys/kernel/unprivileged_userns_clone ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

      - name: Build and verify exact weavec provider
        run: |
          set -euo pipefail
          mkdir -p "$COMPILER_STAGE"
          source_root="$COMPILER_STAGE/source"
          git init "$source_root"
          git -C "$source_root" remote add origin \
            "https://github.com/$WEAVEC_REPOSITORY.git"
          git -C "$source_root" fetch --depth=1 origin "$WEAVEC_COMMIT"
          git -C "$source_root" checkout --detach FETCH_HEAD
          actual_commit="$(git -C "$source_root" rev-parse HEAD)"
          test "$actual_commit" = "$WEAVEC_COMMIT"

          (
            cd "$source_root"
            ./build.sh
          )

          compiler_path="$source_root/build/weavec"
          test -x "$compiler_path"
          command -v clang
          command -v llvm-as
          file "$compiler_path"
          "$compiler_path" capabilities --json \
            > "$COMPILER_STAGE/capabilities.json"
          printf 'WEAVEC_BIN=%s\n' "$compiler_path" >> "$GITHUB_ENV"

          WEAVEC_BIN="$compiler_path" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          stage = Path(os.environ["COMPILER_STAGE"])
          compiler = Path(os.environ["WEAVEC_BIN"])
          capabilities_path = stage / "capabilities.json"
          capabilities_bytes = capabilities_path.read_bytes()
          capabilities = json.loads(capabilities_bytes)
          assert capabilities["format"] == "weavec-capabilities-v1"
          assert capabilities["compiler"]["public_variant"] == "final"
          assert capabilities["language"]["wir_core_version"] == 2

          metadata = {
              "format": "weave-jacquard-weavec-provider-v1",
              "repository": os.environ["WEAVEC_REPOSITORY"],
              "commit": os.environ["WEAVEC_COMMIT"],
              "compiler_sha256": hashlib.sha256(compiler.read_bytes()).hexdigest(),
              "compiler_bytes": compiler.stat().st_size,
              "capabilities_sha256": hashlib.sha256(capabilities_bytes).hexdigest(),
              "capabilities_bytes": len(capabilities_bytes),
              "capabilities_format": capabilities["format"],
              "compiler_version": capabilities["compiler"]["version"],
              "surface_version": capabilities["language"]["surface_version"],
              "grammar_id": capabilities["language"]["grammar_id"],
              "wir_core_version": capabilities["language"]["wir_core_version"],
              "default_target": capabilities["targets"]["default"],
          }
          (stage / "provider-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run unified native qualification
        run: bash scripts/qualify-release.sh native "$QUALIFICATION_DIR"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacquard-native-qualification
          path: ${{ env.QUALIFICATION_DIR }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload compiler provider metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacquard-weavec-provider-metadata
          path: |
            ${{ env.COMPILER_STAGE }}/provider-metadata.json
            ${{ env.COMPILER_STAGE }}/capabilities.json
          if-no-files-found: error
          retention-days: 7
