name: Packaged weavec native E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  WEAVEC_RELEASE: v0.3.0

jobs:
  native-e2e:
    name: Real MCP to packaged weavec
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out Jacquard
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Jacquard and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Install native verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang file llvm

      - name: Resolve immutable weavec release assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/ahojukka5/weavec/releases/tags/$WEAVEC_RELEASE" \
            > release-metadata.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("release-metadata.json").read_text(encoding="utf-8"))
          assets = release.get("assets", [])
          archives = [
              asset
              for asset in assets
              if asset["name"].endswith("-linux-x86_64-glibc.tar.gz")
          ]
          checksums = [asset for asset in assets if asset["name"] == "SHA256SUMS"]
          assert len(archives) == 1, [asset["name"] for asset in assets]
          assert len(checksums) == 1, [asset["name"] for asset in assets]

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"archive_name={archives[0]['name']}\n")
              stream.write(f"archive_url={archives[0]['browser_download_url']}\n")
              stream.write(f"checksum_url={checksums[0]['browser_download_url']}\n")

          print("release:", release["tag_name"])
          print("archive:", archives[0]["name"], archives[0]["size"])
          print("checksum:", checksums[0]["name"], checksums[0]["size"])
          PY

      - name: Download and verify packaged weavec
        env:
          ARCHIVE_NAME: ${{ steps.release.outputs.archive_name }}
          ARCHIVE_URL: ${{ steps.release.outputs.archive_url }}
          CHECKSUM_URL: ${{ steps.release.outputs.checksum_url }}
        run: |
          set -euo pipefail
          mkdir -p dist compiler
          curl --fail --location --retry 3 \
            "$ARCHIVE_URL" \
            --output "dist/$ARCHIVE_NAME"
          curl --fail --location --retry 3 \
            "$CHECKSUM_URL" \
            --output dist/SHA256SUMS

          grep -F " $ARCHIVE_NAME" dist/SHA256SUMS > dist/GLIBC-SHA256SUM
          (
            cd dist
            sha256sum --check GLIBC-SHA256SUM
          )

          tar -C compiler -xzf "dist/$ARCHIVE_NAME"
          compiler_path="$(find compiler -type f -path '*/bin/weavec' -print -quit)"
          test -n "$compiler_path"
          test -x "$compiler_path"
          command -v clang
          command -v llvm-as
          file "$compiler_path"
          printf 'WEAVEC_BIN=%s/%s\n' "$GITHUB_WORKSPACE" "$compiler_path" \
            >> "$GITHUB_ENV"

      - name: Build and run complex programs through real MCP
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/jacquard-native-e2e"
          python -m pytest \
            -m real_e2e \
            tests/e2e/test_real_mcp.py \
            tests/e2e/test_real_mcp_program_matrix.py \
            tests/e2e/test_real_mcp_algorithmic_stress.py \
            tests/e2e/test_real_mcp_batch_edit.py \
            --basetemp "$base" \
            --junitxml qualification-pytest.xml

          mkdir -p qualification
          cp release-metadata.json qualification/weavec-release.json
          cp qualification-pytest.xml qualification/
          cp -a "$base" qualification/pytest-temp

          BASE="$base" python - <<'PY'
          import json
          import os
          from pathlib import Path

          base = Path(os.environ["BASE"])
          summaries = [
              json.loads(path.read_text(encoding="utf-8"))
              for path in sorted(base.rglob("qualification-summary.json"))
          ]
          by_name = {summary["case"]: summary for summary in summaries}
          assert set(by_name) == {
              "while-accumulator",
              "multi-function-chain",
              "memory-flow",
              "binary-search-batch16",
              "batched-sum80",
          }, by_name
          assert by_name["while-accumulator"]["actual_exit"] == 42
          assert by_name["multi-function-chain"]["actual_exit"] == 35
          assert by_name["memory-flow"]["actual_exit"] == 100
          assert by_name["binary-search-batch16"]["actual_exit"] == 26
          assert by_name["batched-sum80"]["actual_exit"] == 80
          assert by_name["batched-sum80"]["write_call_reduction_ratio"] > 0.99
          assert by_name["batched-sum80"]["revision_reduction_ratio"] > 0.98
          assert all(summary["llvm_bytes"] > 0 for summary in summaries)
          assert all(summary["bitcode_bytes"] > 0 for summary in summaries)

          output = Path("qualification/program-matrix-summary.json")
          output.write_text(
              json.dumps(summaries, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          for summary in summaries:
              print(json.dumps(summary, sort_keys=True))
          PY

      - name: Upload native failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jacquard-packaged-weavec-failure
          path: |
            qualification-pytest.xml
            release-metadata.json
            ${{ runner.temp }}/jacquard-native-e2e
          if-no-files-found: warn
          retention-days: 7

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: jacquard-packaged-weavec-qualification
          path: qualification
          if-no-files-found: error
          retention-days: 14
