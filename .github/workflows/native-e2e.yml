name: Packaged weavec native E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  WEAVEC_RELEASE: v0.3.0

jobs:
  native-e2e:
    name: Real MCP to packaged weavec
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Jacquard
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Jacquard and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Install native verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang file llvm

      - name: Resolve immutable weavec release assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/ahojukka5/weavec/releases/tags/$WEAVEC_RELEASE" \
            > release-metadata.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("release-metadata.json").read_text(encoding="utf-8"))
          assets = release.get("assets", [])
          archives = [
              asset
              for asset in assets
              if asset["name"].endswith("-linux-x86_64-glibc.tar.gz")
          ]
          checksums = [asset for asset in assets if asset["name"] == "SHA256SUMS"]
          assert len(archives) == 1, [asset["name"] for asset in assets]
          assert len(checksums) == 1, [asset["name"] for asset in assets]

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"archive_name={archives[0]['name']}\n")
              stream.write(f"archive_url={archives[0]['browser_download_url']}\n")
              stream.write(f"checksum_url={checksums[0]['browser_download_url']}\n")

          print("release:", release["tag_name"])
          print("archive:", archives[0]["name"], archives[0]["size"])
          print("checksum:", checksums[0]["name"], checksums[0]["size"])
          PY

      - name: Download and verify packaged weavec
        env:
          ARCHIVE_NAME: ${{ steps.release.outputs.archive_name }}
          ARCHIVE_URL: ${{ steps.release.outputs.archive_url }}
          CHECKSUM_URL: ${{ steps.release.outputs.checksum_url }}
        run: |
          set -euo pipefail
          mkdir -p dist compiler
          curl --fail --location --retry 3 \
            "$ARCHIVE_URL" \
            --output "dist/$ARCHIVE_NAME"
          curl --fail --location --retry 3 \
            "$CHECKSUM_URL" \
            --output dist/SHA256SUMS

          grep -F " $ARCHIVE_NAME" dist/SHA256SUMS > dist/GLIBC-SHA256SUM
          (
            cd dist
            sha256sum --check GLIBC-SHA256SUM
          )

          tar -C compiler -xzf "dist/$ARCHIVE_NAME"
          compiler_path="$(find compiler -type f -path '*/bin/weavec' -print -quit)"
          test -n "$compiler_path"
          test -x "$compiler_path"
          command -v clang
          command -v llvm-as
          file "$compiler_path"
          printf 'WEAVEC_BIN=%s/%s\n' "$GITHUB_WORKSPACE" "$compiler_path" \
            >> "$GITHUB_ENV"

      - name: Build and run through real MCP
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/jacquard-native-e2e"
          python -m pytest \
            -m real_e2e \
            tests/e2e/test_real_mcp.py \
            --basetemp "$base"

          source_path="$(find "$base" -type f -path '*/builds/*/sources/000-main.weave' -print -quit)"
          trace_path="$(find "$base" -type f -name qualification-trace.json -print -quit)"
          test -n "$source_path"
          test -n "$trace_path"

          mkdir -p qualification
          cp "$source_path" qualification/main.weave
          cp "$trace_path" qualification/qualification-trace.json
          cp release-metadata.json qualification/weavec-release.json

          "$WEAVEC_BIN" --frontend \
            qualification/program.wir \
            qualification/main.weave
          "$WEAVEC_BIN" --backend \
            qualification/program.wir \
            qualification/program.ll
          llvm-as qualification/program.ll -o qualification/program.bc

          grep -F 'define i32 @main' qualification/program.ll
          grep -F 'ret i32 42' qualification/program.ll
          test -s qualification/program.wir
          test -s qualification/program.ll
          test -s qualification/program.bc

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: jacquard-packaged-weavec-qualification
          path: qualification
          if-no-files-found: error
          retention-days: 14
