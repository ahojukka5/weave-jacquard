name: Generate compiler alias cleanup

on:
  push:
    branches:
      - agent/compiler-alias-cleanup-runner

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out generator branch
        uses: actions/checkout@v4
        with:
          ref: agent/compiler-alias-cleanup-runner
          fetch-depth: 0

      - name: Remove compatibility layers and migrate imports
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          root = Path.cwd()
          package = root / "src" / "weave_frontend" / "compiler"
          frontend = package.parent

          module_renames = {
              "compiler_artifacts": "artifacts",
              "compiler_bridge": "bridge",
              "compiler_capabilities": "capabilities",
              "compiler_diagnostics": "diagnostics",
              "compiler_inputs": "inputs",
              "compiler_io": "io",
              "compiler_limits": "limits",
              "compiler_manifest": "manifest",
              "weavec": "validator",
          }
          dependency_adapters = {
              "bounded_process",
              "errors",
              "grammar_help",
              "retained_artifact_io",
              "revision_limits",
              "sexpr",
              "source_map",
          }

          for old, new in module_renames.items():
              source = package / f"{old}.py"
              destination = package / f"{new}.py"
              if not source.is_file():
                  raise SystemExit(f"missing compiler implementation: {source}")
              if destination.exists():
                  raise SystemExit(f"compiler destination already exists: {destination}")
              source.rename(destination)

          package_replacements = {
              "from .bounded_process import": "from ..bounded_process import",
              "from .errors import": "from ..errors import",
              "from .grammar_help import": "from ..grammar_help import",
              "from .retained_artifact_io import": "from ..retained_artifact_io import",
              "from .revision_limits import": "from ..revision_limits import",
              "from .sexpr import": "from ..sexpr import",
              "from .source_map import": "from ..source_map import",
          }
          for old, new in module_renames.items():
              package_replacements[f"from .{old} import"] = f"from .{new} import"

          for path in package.glob("*.py"):
              text = path.read_text(encoding="utf-8")
              for old, new in package_replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          text_roots = [
              root / "src",
              root / "tests",
              root / "scripts",
              root / "docs",
          ]
          text_paths: list[Path] = []
          for directory in text_roots:
              if not directory.exists():
                  continue
              text_paths.extend(
                  path
                  for path in directory.rglob("*")
                  if path.is_file() and path.suffix in {".py", ".md"}
              )
          text_paths.extend([root / "README.md", root / "AGENTS.md", root / "CONTRIBUTING.md"])

          import_from_frontend = re.compile(
              r"from weave_frontend import "
              r"(compiler_artifacts|compiler_bridge|compiler_capabilities|"
              r"compiler_diagnostics|compiler_inputs|compiler_io|compiler_limits|"
              r"compiler_manifest|weavec) as ([A-Za-z_][A-Za-z0-9_]*)"
          )

          def frontend_module_import(match: re.Match[str]) -> str:
              old = match.group(1)
              alias = match.group(2)
              return f"import weave_frontend.compiler.{module_renames[old]} as {alias}"

          for path in text_paths:
              if not path.is_file() or package in path.parents:
                  continue
              text = path.read_text(encoding="utf-8")
              text = import_from_frontend.sub(frontend_module_import, text)
              for old, new in module_renames.items():
                  text = text.replace(
                      f"weave_frontend.{old}",
                      f"weave_frontend.compiler.{new}",
                  )
              for new in module_renames.values():
                  text = text.replace(
                      f"from weave_frontend.compiler.{new} import",
                      "from weave_frontend.compiler import",
                  )
              if path.parent == frontend:
                  for old in module_renames:
                      text = text.replace(
                          f"from .{old} import",
                          "from .compiler import",
                      )
              path.write_text(text, encoding="utf-8")

          removed_root_files = [frontend / f"{name}.py" for name in module_renames]
          removed_adapter_files = [package / f"{name}.py" for name in dependency_adapters]
          for path in [*removed_root_files, *removed_adapter_files]:
              if not path.is_file():
                  raise SystemExit(f"expected compatibility layer is missing: {path}")
              path.unlink()

          architecture_test = root / "tests" / "test_compiler_package_architecture.py"
          architecture_test.write_text(
              '''"""Architecture tests for the owned compiler integration package."""

from __future__ import annotations

import ast
from pathlib import Path

from weave_frontend import compiler

ROOT = Path(__file__).parents[1]
FRONTEND = ROOT / "src" / "weave_frontend"
PACKAGE = FRONTEND / "compiler"
IMPLEMENTATION_MODULES = {
    "__init__.py",
    "artifacts.py",
    "bridge.py",
    "capabilities.py",
    "diagnostics.py",
    "inputs.py",
    "io.py",
    "limits.py",
    "manifest.py",
    "validator.py",
}
LEGACY_STEMS = {
    "compiler_artifacts",
    "compiler_bridge",
    "compiler_capabilities",
    "compiler_diagnostics",
    "compiler_inputs",
    "compiler_io",
    "compiler_limits",
    "compiler_manifest",
    "weavec",
}
REMOVED_ADAPTERS = {
    "bounded_process",
    "errors",
    "grammar_help",
    "retained_artifact_io",
    "revision_limits",
    "sexpr",
    "source_map",
}
FORBIDDEN_UPPER_LAYERS = {
    "artifact_quota",
    "build_targets",
    "database",
    "database_backup",
    "mcp_server",
    "runtime_container",
    "service",
    "snapshot_codec",
    "verified_workspace",
}


def test_compiler_package_exposes_one_public_surface() -> None:
    expected = {
        "CompilerBridge",
        "WeavecCapabilities",
        "WeavecValidator",
        "CapabilityAwareWeavecValidator",
        "CapabilityGrammarIndex",
        "collect_build_diagnostics",
        "validate_compiler_manifest",
        "read_bounded_json",
    }
    assert expected <= set(compiler.__all__)
    for name in expected:
        assert getattr(compiler, name) is not None


def test_compiler_package_contains_only_owned_modules() -> None:
    assert {path.name for path in PACKAGE.glob("*.py")} == IMPLEMENTATION_MODULES
    for stem in LEGACY_STEMS:
        assert not (FRONTEND / f"{stem}.py").exists()
    for stem in REMOVED_ADAPTERS:
        assert not (PACKAGE / f"{stem}.py").exists()


def test_repository_contains_no_legacy_compiler_imports() -> None:
    roots = [ROOT / "src", ROOT / "tests", ROOT / "scripts", ROOT / "docs"]
    for directory in roots:
        if not directory.exists():
            continue
        for path in directory.rglob("*"):
            if not path.is_file() or path.suffix not in {".py", ".md"}:
                continue
            source = path.read_text(encoding="utf-8")
            for stem in LEGACY_STEMS:
                assert ("weave_frontend." + stem) not in source, path
                assert ("from ." + stem + " import") not in source, path


def test_compiler_package_does_not_import_upper_application_layers() -> None:
    for path in PACKAGE.glob("*.py"):
        tree = ast.parse(path.read_text(encoding="utf-8"))
        for node in ast.walk(tree):
            if isinstance(node, ast.Import):
                names = [alias.name for alias in node.names]
            elif isinstance(node, ast.ImportFrom):
                names = [node.module or ""]
                if node.level >= 2 and node.module:
                    top = node.module.split(".", 1)[0]
                    assert top not in FORBIDDEN_UPPER_LAYERS, (path, top)
            else:
                continue
            for name in names:
                assert "weavec0" not in name
                assert "weavec1" not in name
                assert "weave_bootstrap" not in name
                assert "weave-bootstrap" not in name


def test_application_code_uses_public_compiler_api() -> None:
    for path in FRONTEND.glob("*.py"):
        source = path.read_text(encoding="utf-8")
        assert "from .compiler." not in source, path
        assert "import weave_frontend.compiler." not in source, path
''',
              encoding="utf-8",
          )

          (root / "docs" / "compiler-package.md").write_text(
              '''# Compiler integration package

Jacquard owns final-compiler integration through one package:
`weave_frontend.compiler`.

## Public boundary

Application code imports compiler behavior only from the package surface:

```python
from weave_frontend.compiler import (
    CompilerBridge,
    WeavecCapabilities,
    WeavecValidator,
)
```

The package owns capability negotiation, bounded compiler execution, input
materialization, diagnostics, manifests, artifact verification, and compiler
resource limits. Revision orchestration, artifact quota, runtime composition,
storage, and MCP presentation remain outside this package.

## Internal structure

The implementation modules each own one compiler concern:

- `bridge.py`: revision-pinned build orchestration;
- `capabilities.py`: capability registry validation and lookup;
- `validator.py`: frontend validation and WIR retrieval;
- `inputs.py`: ordered source rendering and materialization;
- `diagnostics.py`: compiler diagnostic validation and node mapping;
- `manifest.py`: build-manifest validation;
- `artifacts.py`: artifact identity, verification, and publication primitives;
- `io.py`: bounded compiler-generated file reads;
- `limits.py`: compiler-specific byte ceilings and identity formats.

These modules import lower-level Jacquard primitives directly with parent-package
imports. Pass-through adapter modules are not part of the design.

## Compatibility discipline

The former flat compiler modules were internal implementation paths, not a
supported public compatibility contract. They are removed rather than retained
as aliases or forwarding modules.

Do not add compatibility shims, duplicate import paths, forwarding modules, or
deprecation wrappers without an explicit supported public compatibility
requirement. When an internal boundary changes, migrate every repository caller
and remove the obsolete path in the same change.

## Dependency direction

```text
MCP / CLI / runtime / revision / quota adapters
                    |
                    v
          weave_frontend.compiler
                    |
                    v
process + source map + grammar + domain errors + retained artifact I/O
                    |
                    v
          final public weavec binary
```

The compiler package must not import MCP modules, database backends, runtime
containers, application quota services, `weavec0`, `weavec1`, or bootstrap
compiler code. Architecture tests enforce the package contents, dependency
direction, and absence of obsolete compiler import paths.
''',
              encoding="utf-8",
          )

          compatibility_rule = '''

## Compatibility discipline

Internal modules and import paths are not compatibility commitments. Do not add
aliases, forwarding modules, duplicate paths, or deprecation shims unless an
explicit supported public compatibility requirement demands them. Migrate all
repository callers and remove obsolete internal paths in the same change.
'''
          for name in ("AGENTS.md", "CONTRIBUTING.md"):
              path = root / name
              text = path.read_text(encoding="utf-8")
              if "## Compatibility discipline" not in text:
                  path.write_text(text.rstrip() + compatibility_rule + "\n", encoding="utf-8")

          legacy_tokens: list[str] = []
          for stem in module_renames:
              legacy_tokens.extend(
                  [
                      f"weave_frontend.{stem}",
                      f"from .{stem} import",
                  ]
              )
          failures: list[str] = []
          for path in text_paths:
              if not path.is_file() or path == architecture_test:
                  continue
              text = path.read_text(encoding="utf-8")
              for token in legacy_tokens:
                  if token in text:
                      failures.append(f"{path}: {token}")
          if failures:
              raise SystemExit("legacy compiler imports remain:\n" + "\n".join(failures))

          workflow = root / ".github" / "workflows" / "compiler-alias-cleanup-generator.yml"
          workflow.unlink()
          PY

      - name: Validate generated tree
        run: |
          python -m compileall -q src tests scripts
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_compiler_package_architecture.py
          python -m ruff check .

      - name: Commit generated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(compiler): remove compatibility layers" -m "Migrate every repository caller to the owned compiler package and remove obsolete flat aliases and pass-through dependency adapters."
          git push origin HEAD:agent/compiler-alias-cleanup-runner
