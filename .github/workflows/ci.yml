name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov ruff

      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Lint
        run: |
          set -o pipefail
          ruff check . 2>&1 | tee ruff.log

      - name: Test
        run: |
          set -o pipefail
          base="$RUNNER_TEMP/jacquard-ci"
          pytest -q --tb=short --cov=weave_frontend --cov-report=term-missing \
            --basetemp "$base" 2>&1 | tee pytest.log

          mkdir -p qualification
          mapfile -t revision_traces < <(
            find "$base" -name revision-reads-trace.json -print
          )
          mapfile -t concurrency_traces < <(
            find "$base" -name single-node-concurrency-trace.json -print
          )
          test "${#revision_traces[@]}" -eq 1
          test "${#concurrency_traces[@]}" -eq 1
          cp "${revision_traces[0]}" qualification/revision-reads-trace.json
          cp "${concurrency_traces[0]}" \
            qualification/single-node-concurrency-trace.json

      - name: Upload CI qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: jacquard-ci-qualification
          path: qualification
          if-no-files-found: error
          retention-days: 7

      - name: Upload CI failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jacquard-ci-failure
          path: |
            ruff.log
            pytest.log
          if-no-files-found: ignore
          retention-days: 7
