name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refactor:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: refactor/canonical-weavec-integration
          fetch-depth: 0

      - name: Apply canonical weavec migration
        run: python scripts/refactor-canonical-weavec.py

      - name: Commit migrated tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: use canonical weavec integration"
          git push origin HEAD:refactor/canonical-weavec-integration

  test:
    if: github.event_name == 'push' || github.actor == 'github-actions[bot]'
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov ruff

      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=weave_frontend --cov-report=term-missing
