name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov ruff

      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Apply temporary Ruff fixes
        run: ruff check . --fix

      - name: Collect Ruff-fixed files
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess

          changed = subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()
          for name in changed:
              source = Path(name)
              target = Path("ruff-fixed") / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          PY

      - name: Upload Ruff-fixed files
        uses: actions/upload-artifact@v4
        with:
          name: ruff-fixed-files
          path: ruff-fixed

      - name: Require committed Ruff fixes
        run: git diff --exit-code

      - name: Test
        run: pytest --cov=weave_frontend --cov-report=term-missing
