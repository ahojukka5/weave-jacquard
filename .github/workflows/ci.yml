name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov ruff

      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Lint
        run: |
          set -o pipefail
          ruff check . 2>&1 | tee ruff.log

      - name: Test
        run: |
          set -o pipefail
          base="$RUNNER_TEMP/jacquard-ci"
          pytest -q --tb=short --cov=weave_frontend --cov-report=term-missing \
            --basetemp "$base" 2>&1 | tee pytest.log

          mkdir -p qualification
          mapfile -t revision_traces < <(
            find "$base" -name revision-reads-trace.json -print
          )
          mapfile -t node_concurrency_traces < <(
            find "$base" -name single-node-concurrency-trace.json -print
          )
          mapfile -t program_target_traces < <(
            find "$base" -name program-target-concurrency-trace.json -print
          )
          mapfile -t context_policy_traces < <(
            find "$base" -name context-policy-concurrency-trace.json -print
          )
          mapfile -t branch_create_traces < <(
            find "$base" -name reproducible-branch-create-trace.json -print
          )
          mapfile -t resume_snapshot_traces < <(
            find "$base" -name resume-snapshot-trace.json -print
          )
          mapfile -t agent_checkpoint_traces < <(
            find "$base" -name agent-checkpoint-trace.json -print
          )
          test "${#revision_traces[@]}" -eq 1
          test "${#node_concurrency_traces[@]}" -eq 1
          test "${#program_target_traces[@]}" -eq 1
          test "${#context_policy_traces[@]}" -eq 1
          test "${#branch_create_traces[@]}" -eq 1
          test "${#resume_snapshot_traces[@]}" -eq 1
          test "${#agent_checkpoint_traces[@]}" -eq 1
          cp "${revision_traces[0]}" qualification/revision-reads-trace.json
          cp "${node_concurrency_traces[0]}" \
            qualification/single-node-concurrency-trace.json
          cp "${program_target_traces[0]}" \
            qualification/program-target-concurrency-trace.json
          cp "${context_policy_traces[0]}" \
            qualification/context-policy-concurrency-trace.json
          cp "${branch_create_traces[0]}" \
            qualification/reproducible-branch-create-trace.json
          cp "${resume_snapshot_traces[0]}" \
            qualification/resume-snapshot-trace.json
          cp "${agent_checkpoint_traces[0]}" \
            qualification/agent-checkpoint-trace.json

      - name: Upload CI qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: jacquard-ci-qualification
          path: qualification
          if-no-files-found: error
          retention-days: 7

      - name: Upload CI failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jacquard-ci-failure
          path: |
            ruff.log
            pytest.log
          if-no-files-found: ignore
          retention-days: 7
