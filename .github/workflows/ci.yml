name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This repository is public. A pull_request from a fork must never reach
  # the self-hosted runner below -- `qualification` needs this job and
  # fails outright (not a silent skip) if the PR's head repository isn't
  # this same repository, i.e. isn't from someone with write access.
  guard-self-hosted:
    name: Verify trusted source for self-hosted jobs
    runs-on: ubuntu-latest
    steps:
      - name: Reject pull requests from forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Self-hosted runner jobs do not run for pull requests from forks (head repository: ${{ github.event.pull_request.head.repo.full_name }})."
          exit 1

  qualification:
    name: Python qualification
    needs: guard-self-hosted
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      QUALIFICATION_DIR: ${{ runner.temp }}/jacquard-python-qualification

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [[ -e /proc/sys/kernel/unprivileged_userns_clone ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

      - name: Install Jacquard qualification environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run unified Python qualification
        run: bash scripts/qualify.sh python "$QUALIFICATION_DIR"

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: jacquard-python-qualification
          path: ${{ env.QUALIFICATION_DIR }}
          if-no-files-found: error
          retention-days: 7
