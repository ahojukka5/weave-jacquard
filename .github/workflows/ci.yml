name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov ruff

      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Lint
        run: ruff check . --output-format=json > ruff-results.json

      - name: Upload Ruff diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: branch-activity-ruff-failure
          path: ruff-results.json
          if-no-files-found: error
          retention-days: 7

      - name: Test
        run: pytest --cov=weave_frontend --cov-report=term-missing
