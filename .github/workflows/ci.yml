name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-and-test:
    if: github.actor != 'github-actions[bot]'
    name: Canonical weavec migration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov ruff

      - name: Apply migration and validate final tree
        run: |
          python scripts/refactor-canonical-weavec.py
          python -m pip install -e .
          python -m compileall -q src tests
          ruff check .
          pytest --cov=weave_frontend --cov-report=term-missing

      - name: Commit final migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: use canonical weavec integration"
          git push origin HEAD:main
