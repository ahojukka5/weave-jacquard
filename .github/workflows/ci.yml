name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This repository is public. A pull_request from a fork must never reach
  # the self-hosted runner below -- `qualification` needs this job and
  # fails outright (not a silent skip) if the PR's head repository isn't
  # this same repository, i.e. isn't from someone with write access.
  guard-self-hosted:
    name: Verify trusted source for self-hosted jobs
    runs-on: ubuntu-latest
    steps:
      - name: Reject pull requests from forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Self-hosted runner jobs do not run for pull requests from forks (head repository: ${{ github.event.pull_request.head.repo.full_name }})."
          exit 1

  qualification:
    name: Portable Python qualification
    needs: guard-self-hosted
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Compute qualification directory
        run: echo "QUALIFICATION_DIR=${{ runner.temp }}/jacquard-python-qualification" >> "$GITHUB_ENV"

      - name: Install Jacquard qualification environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Record runner and sandbox capabilities
        run: |
          mkdir -p "$QUALIFICATION_DIR"
          python --version | tee "$QUALIFICATION_DIR/python-version.txt"
          python -m pip freeze > "$QUALIFICATION_DIR/python-packages.txt"
          uname -a | tee "$QUALIFICATION_DIR/platform.txt"
          python - "$QUALIFICATION_DIR/sandbox-capabilities.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          from weave_frontend.sandbox import BubblewrapSandbox

          path = Path(sys.argv[1])
          capabilities = BubblewrapSandbox().capabilities()
          path.write_text(
              json.dumps(capabilities, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(capabilities, indent=2, sort_keys=True))
          PY

      - name: Compile Python sources
        run: |
          set -o pipefail
          python -m compileall -q src tests scripts/qualification.py 2>&1 \
            | tee "$QUALIFICATION_DIR/compileall.log"

      - name: Run Ruff
        run: |
          set -o pipefail
          python -m ruff check . 2>&1 | tee "$QUALIFICATION_DIR/ruff.log"

      - name: Run pytest
        run: |
          set -o pipefail
          python -m pytest \
            -q \
            --tb=short \
            --strict-markers \
            -p no:cacheprovider \
            -m "not real_e2e" \
            --cov=weave_frontend \
            --cov-report=term-missing \
            --cov-report=xml:"$QUALIFICATION_DIR/coverage.xml" \
            --junitxml="$QUALIFICATION_DIR/pytest-junit.xml" \
            2>&1 | tee "$QUALIFICATION_DIR/pytest.log"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacquard-python-qualification
          path: ${{ env.QUALIFICATION_DIR }}
          if-no-files-found: warn
          retention-days: 7
