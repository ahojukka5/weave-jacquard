name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This repository is public. A pull_request from a fork must never reach
  # the self-hosted runner below -- `qualification` needs this job and
  # fails outright (not a silent skip) if the PR's head repository isn't
  # this same repository, i.e. isn't from someone with write access.
  guard-self-hosted:
    name: Verify trusted source for self-hosted jobs
    runs-on: ubuntu-latest
    steps:
      - name: Reject pull requests from forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Self-hosted runner jobs do not run for pull requests from forks (head repository: ${{ github.event.pull_request.head.repo.full_name }})."
          exit 1

  qualification:
    name: Portable Python qualification
    needs: guard-self-hosted
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize qualification directories
        run: |
          qualification_dir="$GITHUB_WORKSPACE/qualification-evidence"
          virtualenv_dir="$GITHUB_WORKSPACE/.venv-ci"
          mkdir -p "$qualification_dir"
          echo "QUALIFICATION_DIR=$qualification_dir" >> "$GITHUB_ENV"
          echo "VIRTUALENV_DIR=$virtualenv_dir" >> "$GITHUB_ENV"

      - name: Select supported runner Python
        run: |
          set -euo pipefail
          for candidate in python3.13 python3.12 python3.11 python3 python; do
            if ! command -v "$candidate" >/dev/null 2>&1; then
              continue
            fi
            if "$candidate" - <<'PY'
          import sys
          raise SystemExit(0 if sys.version_info >= (3, 11) else 1)
          PY
            then
              python_path="$(command -v "$candidate")"
              echo "SYSTEM_PYTHON_BIN=$python_path" >> "$GITHUB_ENV"
              "$python_path" --version | tee "$QUALIFICATION_DIR/python-version.txt"
              exit 0
            fi
          done
          echo "::error::Python 3.11 or newer is required on the self-hosted runner."
          exit 1

      - name: Create qualification virtual environment
        run: |
          "$SYSTEM_PYTHON_BIN" -m venv "$VIRTUALENV_DIR"
          echo "PYTHON_BIN=$VIRTUALENV_DIR/bin/python" >> "$GITHUB_ENV"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Jacquard qualification environment
        run: |
          "$VIRTUALENV_DIR/bin/python" -m pip install --upgrade pip
          "$VIRTUALENV_DIR/bin/python" -m pip install -e '.[dev]'

      - name: Record runner and sandbox capabilities
        run: |
          "$PYTHON_BIN" -m pip freeze > "$QUALIFICATION_DIR/python-packages.txt"
          uname -a | tee "$QUALIFICATION_DIR/platform.txt"
          "$PYTHON_BIN" - "$QUALIFICATION_DIR/sandbox-capabilities.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          from weave_frontend.sandbox import BubblewrapSandbox

          path = Path(sys.argv[1])
          capabilities = BubblewrapSandbox().capabilities()
          path.write_text(
              json.dumps(capabilities, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(capabilities, indent=2, sort_keys=True))
          PY

      - name: Compile Python sources
        run: |
          set -o pipefail
          "$PYTHON_BIN" -m compileall -q src tests scripts/qualification.py 2>&1 \
            | tee "$QUALIFICATION_DIR/compileall.log"

      - name: Run Ruff
        run: |
          set -o pipefail
          "$PYTHON_BIN" -m ruff check . 2>&1 | tee "$QUALIFICATION_DIR/ruff.log"

      - name: Run pytest
        run: |
          set -o pipefail
          "$PYTHON_BIN" -m pytest \
            -q \
            --tb=short \
            --strict-markers \
            -p no:cacheprovider \
            -m "not real_e2e" \
            --cov=weave_frontend \
            --cov-report=term-missing \
            --cov-report=xml:"$QUALIFICATION_DIR/coverage.xml" \
            --junitxml="$QUALIFICATION_DIR/pytest-junit.xml" \
            2>&1 | tee "$QUALIFICATION_DIR/pytest.log"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacquard-python-qualification
          path: ${{ github.workspace }}/qualification-evidence
          if-no-files-found: warn
          retention-days: 7
