name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-and-test:
    name: Canonical weavec migration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: canonical-weavec-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov ruff

      - name: Apply migration and validate final tree
        run: |
          set -o pipefail
          {
            python scripts/refactor-canonical-weavec.py
            python -m pip install -e .
            python -m compileall -q src tests
            ruff check .
            pytest --cov=weave_frontend --cov-report=term-missing
          } 2>&1 | tee canonical-migration.log

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-weavec-migration-log
          path: canonical-migration.log
          if-no-files-found: warn

      - name: Commit final migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: use canonical weavec integration"
          git push origin HEAD:canonical-weavec-integration
