name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: Python qualification
    runs-on: [self-hosted, linux, x64, lumi, lumi-cpu, lumi-small]
    timeout-minutes: 20
    env:
      QUALIFICATION_DIR: ${{ runner.temp }}/jacquard-python-qualification

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [[ -e /proc/sys/kernel/unprivileged_userns_clone ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

      - name: Install Jacquard qualification environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run unified Python qualification
        run: bash scripts/qualify.sh python "$QUALIFICATION_DIR"

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: jacquard-python-qualification
          path: ${{ env.QUALIFICATION_DIR }}
          if-no-files-found: error
          retention-days: 7
