name: Assemble evidence profile slice

on:
  push:
    branches:
      - agent/evidence-profile-clean-runner

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evidence-profile-clean-runner
          fetch-depth: 0

      - name: Assemble intended files
        run: python scripts/assemble_evidence_profile_slice.py

      - name: Validate intended slice
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff format \
            src/weave_frontend/build_targets.py \
            src/weave_frontend/compiler/__init__.py \
            src/weave_frontend/compiler/bridge.py \
            src/weave_frontend/compiler/capabilities.py \
            src/weave_frontend/compiler/evidence.py \
            src/weave_frontend/compiler/limits.py \
            tests/test_build_targets.py \
            tests/test_compiler_capabilities.py \
            tests/test_compiler_evidence_profiles.py \
            tests/test_compiler_package_architecture.py
          python -m ruff check \
            src/weave_frontend/build_targets.py \
            src/weave_frontend/compiler/__init__.py \
            src/weave_frontend/compiler/bridge.py \
            src/weave_frontend/compiler/capabilities.py \
            src/weave_frontend/compiler/evidence.py \
            src/weave_frontend/compiler/limits.py \
            tests/test_build_targets.py \
            tests/test_compiler_capabilities.py \
            tests/test_compiler_evidence_profiles.py \
            tests/test_compiler_package_architecture.py
          python -m compileall -q src tests
          python -m pytest -q \
            tests/test_build_targets.py \
            tests/test_compiler_capabilities.py \
            tests/test_compiler_evidence_profiles.py \
            tests/test_compiler_package_architecture.py
          git diff --check

      - name: Commit clean implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit \
            -m "feat(compiler): add evidence profiles" \
            -m "Add strict compiler evidence profiles to revisioned targets and build identity. Preflight requested protocols against the exact selected final compiler before build execution."
          git push origin HEAD:agent/evidence-profile-clean-runner
