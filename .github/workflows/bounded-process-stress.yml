name: Bounded process stress

# The 1000-iteration matrix is soak/confidence evidence, not a merge gate.
# Keep it available on a schedule and on demand while ordinary pull requests
# rely on the bounded-process unit tests in the main CI workflow.
on:
  schedule:
    - cron: '31 2 * * 2,5'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  stress:
    name: Run 1000-iteration termination matrix
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select supported runner Python
        run: |
          set -euo pipefail
          for candidate in python3.13 python3.12 python3.11 python3 python; do
            if ! command -v "$candidate" >/dev/null 2>&1; then
              continue
            fi
            if "$candidate" - <<'PY'
          import sys
          raise SystemExit(0 if sys.version_info >= (3, 11) else 1)
          PY
            then
              echo "PYTHON_BIN=$(command -v "$candidate")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::Python 3.11 or newer is required on the self-hosted runner."
          exit 1

      - name: Run bounded process stress matrix
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          "$PYTHON_BIN" scripts/stress_bounded_process.py --iterations 1000
