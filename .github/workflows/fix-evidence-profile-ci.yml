name: Fix evidence profile CI

on:
  push:
    branches:
      - agent/evidence-profile-ci-fix-runner

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evidence-profile-ci-fix-runner
          fetch-depth: 0

      - name: Apply CI fixes
        run: python scripts/fix_evidence_profile_ci.py

      - name: Validate full portable suite
        run: |
          python -m pip install -e '.[dev]'
          mapfile -t pyfiles < <(
            git diff --name-only --diff-filter=ACM HEAD -- '*.py' |
            while read -r path; do
              if [ -f "$path" ]; then
                printf '%s\n' "$path"
              fi
            done
          )
          python -m ruff format "${pyfiles[@]}"
          python -m ruff check "${pyfiles[@]}"
          python -m compileall -q src tests scripts/qualification.py
          python -m pytest \
            -q \
            --tb=short \
            --strict-markers \
            -p no:cacheprovider \
            -m 'not real_e2e'
          git diff --check

      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit \
            -m "fix(compiler): complete evidence profile migration" \
            -m "Use the global compiler protocol registry, migrate the concurrent target writer, and make all build-key v6 fixtures explicit about the none profile."
          git push origin HEAD:agent/evidence-profile-ci-fix-runner
